name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: sbt/setup-sbt@1f718a9acba84199353b2835642645f66393cae7
      - run: sbt coreJVM/test firstContactJVM/compile benchmarkSmoke
      - run: sbt coreJVM/doc docs/tlSite
      - run: sbt coverageJVM

  scala-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: sbt/setup-sbt@1f718a9acba84199353b2835642645f66393cae7
      - run: sbt coreJS/test firstContactJS/compile

  compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        scala: ["3.3.8", "3.4.2", "3.7.4"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
      - uses: sbt/setup-sbt@1f718a9acba84199353b2835642645f66393cae7
      - run: sbt "++${{ matrix.scala }}!" compileAll testAll
